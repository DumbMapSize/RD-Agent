qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2017-07-17
    end_time: 2026-07-27
    instruments: *market
    data_loader:
        class: StaticSafeNestedDataLoader
        module_path: qlib_static_safe_loader.py
        kwargs:
            dataloader_l:
                - class: qlib.contrib.data.loader.Alpha158DL
                  kwargs:
                    config:
                        label: 
                            - ["Ref($close, -2)/Ref($open, -1) - 1"]
                            - ["LABEL0"]
                - class: qlib.data.dataset.loader.StaticDataLoader
                  kwargs:
                    config: "combined_factors_df.parquet"

    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: 2017-07-17
              fit_end_time: 2022-12-30
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 2
            forbid_all_trade_at_limit: false
    backtest:
        start_time: 2025-01-02
        end_time: 2026-07-23
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold:
                - "OpeningLimit($limit_rate, 1)"
                - "OpeningLimit($limit_rate, -1)"
            deal_price: open
            open_cost: 0.0001
            close_cost: 0.0006
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 16
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2017-07-17, 2022-12-30]
                valid: [2023-01-03, 2024-12-31]
                test: [2025-01-02, 2026-07-23]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: LimitExpressionPortAnaRecord
          module_path: rdagent.scenarios.qlib.experiment.limit_expression_record
          kwargs: 
            config: *port_analysis_config
